<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Edit Admin Profile - FixMate</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <main class="container p-lg" style="max-width:500px">
      <h2>Edit Profile</h2>

      <form id="profileForm">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input id="name" type="text" required class="form-control"/>
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="email" type="email" required class="form-control"/>
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Password (optional)</label>
          <input id="password" type="password" class="form-control"/>
        </div>

        <button id="submitBtn" class="btn btn-primary mt-md">
          Update
        </button>

        <p id="successMsg" class="mt-sm" style="color:green"></p>
        <p id="errorMsg" class="mt-sm" style="color:red"></p>
      </form>
    </main>

    <script type="module" src="/assets/js/pages/admin/profile.js"></script>

    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto("navbar-dynamic");
    </script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
