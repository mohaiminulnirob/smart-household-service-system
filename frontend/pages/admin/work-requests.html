<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Admin Work Requests - FixMate</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <main class="container p-lg" style="max-width: 900px">
      <h2>Work Requests</h2>
      <p class="text-muted">
        View all user requests and their status.
      </p>
      <div class="flex-row gap-md mb-md">
        <select id="sortSelect" class="form-control max-w-180">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>

        <select id="filterSelect" class="form-control" style="max-width: 200px">
          <option value="all">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Assigned">Assigned</option>
          <option value="Accepted">Accepted</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <div id="workRequests"></div>
    </main>

    <script
      type="module"
      src="/assets/js/pages/admin/work-requests.js"
    ></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto("navbar-dynamic");
    </script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
