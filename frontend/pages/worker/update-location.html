<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Update Location</title>
  <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>

<div id="navbar-dynamic"></div>

<main class="container p-lg" style="max-width:900px">
  <h2>Update Your Location 📍</h2>
  <p class="text-muted">Your location helps users find nearby workers.</p>

  <button class="btn btn-primary" id="gpsBtn">Use GPS</button>

  <form id="locForm" class="mt-lg">
    <div class="form-group">
      <label class="form-label">Latitude</label>
      <input name="latitude" class="form-control" required>
      <div class="form-error"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Longitude</label>
      <input name="longitude" class="form-control" required>
      <div class="form-error"></div>
    </div>

    <button class="btn btn-primary mt-md">Update</button>
  </form>

  <div id="message" class="mt-md"></div>
</main>

<script type="module" src="/assets/js/pages/worker/update-location.js"></script>
<script type="module">
  import { renderNavbarInto } from "/assets/js/components/navbar.js";
  renderNavbarInto();
</script>

<div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
