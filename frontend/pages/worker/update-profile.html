<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Update Worker Profile - FixMate</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <main class="container p-lg" style="max-width: 500px">
      <h2>Update Profile</h2>

      <form id="updateForm">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" id="name" class="form-control" required />
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" id="phone" class="form-control" />
        </div>

        <div class="form-group">
          <label class="form-label">Skill Category</label>
          <select id="skill_category" class="form-control" required>
            <option value="">Select Category</option>
          </select>
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Profile Picture</label>
          <input type="file" id="profilePic" class="form-control" />
        </div>

        <button id="saveBtn" class="btn btn-primary mt-md">
          Save Changes
        </button>
      </form>
    </main>

    <script
      type="module"
      src="/assets/js/pages/worker/update-profile.js"
    ></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
