<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Requests - Worker</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <div id="navbar-dynamic"></div>

    <main class="container" style="padding: 2rem; max-width: 900px">
      <div style="margin-top: 2rem; display: flex; gap: 20px; flex-wrap: wrap">
        <a href="/pages/worker/my-requests.html" class="btn btn-secondary">
          📄 My Requests
        </a>

        <a href="/pages/worker/ratings.html" class="btn btn-secondary">
          ⭐ My Ratings
        </a>

        <a href="/pages/worker/profile.html" class="btn btn-secondary">
          👤 Profile
        </a>
        <a href="/pages/auth/change-password.html" class="btn btn-secondary">
          🔑 Change Password
        </a>
      </div>

      <h2>My Assigned Requests</h2>
      <div style="margin: 1rem 0; display: flex; gap: 12px; flex-wrap: wrap">
        <!-- Sort -->
        <select id="sortSelect" class="form-control" style="max-width: 180px">
          <option value="desc">Newest First</option>
          <option value="asc">Oldest First</option>
        </select>

        <!-- Filter -->
        <select id="filterSelect" class="form-control" style="max-width: 180px">
          <option value="all">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Assigned">Assigned</option>
          <option value="Accepted">Accepted</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <div id="requestsContainer" style="margin-top: 1.5rem"></div>
    </main>

    <script type="module" src="/assets/js/pages/worker/my-requests.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  </body>
</html>
