<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Worker Profile - FixMate</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <main class="container p-lg" style="max-width: 500px">
      <h2>My Profile</h2>

      <div class="text-center mb-lg">
        <img
          id="profileImg"
          src="/assets/img/default-avatar.png"
          class="profile-avatar"
          style="cursor: pointer"
        />
      </div>

      <!-- ========== FULLSCREEN IMAGE MODAL ========== -->
      <div id="imgModal" class="img-modal">
        <span class="img-modal-close">&times;</span>
        <img id="modalImg" src="" />
      </div>
      <!-- ============================================ -->

      <div class="card p-lg">
        <p><b>Name:</b> <span id="name"></span></p>
        <p><b>Email:</b> <span id="email"></span></p>
        <p><b>Phone:</b> <span id="phone"></span></p>
        <p><b>Skill Category:</b> <span id="skill"></span></p>
      </div>

      <button
        id="updateBtn"
        class="btn btn-primary mt-lg w-100"
      >
        Update Profile
      </button>
    </main>

    <script type="module" src="/assets/js/pages/worker/profile.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
