<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Worker Dashboard - FixMate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <main class="container" style="padding: 2rem; max-width: 900px">
       <!-- PROFILE HEADER SECTION -->
      <div class="profile-header">
        
        <!-- Left: Profile Picture -->
        <div class="profile-header-img">
          <img id="dashProfileImg"
              src="/assets/img/default-avatar.png"
              alt="Profile Picture" />
        </div>

        <!-- Right: Greeting Text -->
        <div class="profile-header-text">
          <h2>Hello, <span id="dashUserName">Worker</span> 👋</h2>
          <p>Manage your assigned service requests.</p>
        </div>

      </div>

      <!-- ACTION BUTTONS -->
      <div style="margin-top: 2rem; display: flex; gap: 20px; flex-wrap: wrap">
        <a href="/pages/worker/my-requests.html" class="btn btn-primary">
          📄 My Requests
        </a>

        <a href="/pages/worker/ratings.html" class="btn btn-secondary">
          ⭐ My Ratings
        </a>

        <a href="/pages/worker/profile.html" class="btn btn-secondary">
          👤 Profile
        </a>

        <a href="/pages/worker/update-location.html" class="btn btn-secondary">
          📍 Update Location
        </a>
        
        <button id="openAvailabilityForm" class="btn btn-secondary">
          ⚡ Update Availability
        </button>
      </div>

      <!-- AVAILABILITY FORM -->
      <div
        id="availabilityForm"
        style="display: none; margin-top: 20px"
        class="card"
      >
        <h3>Update Availability</h3>

        <label><input type="radio" name="availability" value="Available" /> Available</label>
        <label><input type="radio" name="availability" value="Busy" /> Busy</label>
        <label><input type="radio" name="availability" value="Offline" /> Offline</label>

        <button id="submitAvailability" class="btn btn-primary" style="margin-top: 12px">
          Submit
        </button>
      </div>

      <!-- RECENT REQUESTS -->
      <section style="margin-top: 2rem">
        <h3>Recent Assigned Work</h3>
        <div id="recentRequests"></div>
      </section>
    </main>

    <script type="module" src="/assets/js/pages/worker/dashboard.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  </body>
</html>
