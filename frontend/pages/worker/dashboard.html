<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Worker Dashboard - FixMate</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <main class="container p-lg" style="max-width: 900px">
      <h2>Welcome Worker 👷</h2>
      <p class="text-muted">Manage your assigned service requests.</p>

      <!-- ACTION BUTTONS -->
      <div class="card-grid mt-lg">
        <a href="/pages/worker/my-requests.html" class="btn btn-primary">
          📄 My Requests
        </a>

        <a href="/pages/worker/ratings.html" class="btn btn-secondary">
          ⭐ My Ratings
        </a>

        <a href="/pages/worker/update-location.html" class="btn btn-secondary">
          📍 Update Location
        </a>

        <a href="/pages/worker/profile.html" class="btn btn-secondary">
          👤 Profile
        </a>

        <a href="/pages/worker/update-availability.html" class="btn btn-secondary">
          ⚡ Update Availability
        </a>
      </div>

      <!-- RECENT REQUESTS -->
      <section class="mt-lg">
        <h3>Recent Assigned Work</h3>
        <div id="recentRequests"></div>
      </section>
    </main>

    <script type="module" src="/assets/js/pages/worker/dashboard.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
