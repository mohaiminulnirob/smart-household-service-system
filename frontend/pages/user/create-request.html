<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create Request - FixMate</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <div id="navbar-dynamic"></div>

    <main class="container p-lg" style="max-width: 900px">
      <h2>Create Service Request</h2>
      <p class="text-muted">
        Describe your issue and optionally pick a nearby worker before
        submitting.
      </p>

      <form id="requestForm" class="mt-md">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select
            class="form-control"
            name="category"
            id="categorySelect"
            required
          >
            <option value="">Select one</option>
          </select>
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea
            class="form-control"
            name="description"
            rows="3"
            required
          ></textarea>
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Location (text)</label>
          <input
            class="form-control"
            name="location"
            id="locationInput"
            required
          />
          <div class="form-error"></div>
        </div>

        <!-- IMAGE UPLOAD -->
        <div class="form-group">
          <label class="form-label">Problem Image (optional)</label>
          <input
            type="file"
            id="imageInput"
            accept="image/*"
            class="form-control"
          />
          <img
            id="previewImg"
            class="preview-img"
          />
        </div>

        <div class="flex-row flex-wrap mt-md gap-10">
          <div class="flex-1" style="min-width: 150px">
            <label class="form-label">Latitude</label>
            <input
              name="latitude"
              id="latitudeInput"
              class="form-control"
              placeholder="23.7806"
            />
          </div>

          <div class="flex-1" style="min-width: 150px">
            <label class="form-label">Longitude</label>
            <input
              name="longitude"
              id="longitudeInput"
              class="form-control"
              placeholder="90.2794"
            />
          </div>

          <div class="flex-row gap-sm">
            <button
              type="button"
              id="gpsBtn"
              class="btn btn-secondary"
            >
              Use GPS
            </button>
            <button
              type="button"
              id="findNearbyBtn"
              class="btn btn-primary"
            >
              Find Nearby Workers
            </button>
          </div>
        </div>

        <input type="hidden" id="selectedWorkerId" name="selected_worker_id" />

        <div id="nearbyArea" class="mt-md" style="display: none">
          <h3>Nearby Workers</h3>
          <p class="text-muted" style="font-size: 0.95rem">
            Select one worker to explicitly assign them (optional).
          </p>
          <div id="nearbyList"></div>
        </div>

        <div class="flex-row mt-md gap-md">
          <button type="submit" class="btn btn-primary">Submit Request</button>
          <button
            type="button"
            id="clearSelection"
            class="btn btn-secondary"
            style="display: none"
          >
            Clear selection
          </button>
        </div>
      </form>

      <div id="message" class="mt-md"></div>
    </main>

    <script
      type="module"
      src="/assets/js/pages/user/create-request.js"
    ></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
