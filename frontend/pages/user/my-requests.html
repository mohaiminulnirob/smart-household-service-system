<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Requests - FixMate</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>
    <div
      style="
        margin-top: 2rem;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
        text-align: center;
      "
    >
      <a href="/pages/user/create-request.html" class="btn btn-secondary">
        ➕ Create Service Request
      </a>

      <a href="/pages/user/my-requests.html" class="btn btn-secondary">
        📄 My Requests
      </a>

      <a href="/pages/user/profile.html" class="btn btn-secondary">
        👤 Profile
      </a>

      <a href="/pages/auth/change-password.html" class="btn btn-secondary">
        🔑 Change Password
      </a>
    </div>

    <main class="container" style="padding: 2rem 1rem; max-width: 900px">
      <h2>My Service Requests</h2>
      <p style="color: var(--muted)">Track your service progress.</p>
      <div style="margin: 1rem 0; display: flex; gap: 12px; flex-wrap: wrap">
        <select id="sortSelect" class="form-control" style="max-width: 180px">
          <option value="desc">Newest First</option>
          <option value="asc">Oldest First</option>
        </select>

        <select id="filterSelect" class="form-control" style="max-width: 180px">
          <option value="all">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Assigned">Assigned</option>
          <option value="Accepted">Accepted</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <div id="requestsContainer" style="margin-top: 1.5rem"></div>
    </main>

    <script type="module" src="/assets/js/pages/user/my-requests.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  </body>
</html>
