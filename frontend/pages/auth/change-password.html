<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Change Password - FixMate</title>
    <link rel="stylesheet" href="/assets/css/global.css" />

    <style>
      .auth-container {
        max-width: 380px;
        margin: 8rem auto;
        background: var(--card-bg);
        padding: 2rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        text-align: center;
      }

      .auth-container h2 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }

      .auth-container p {
        color: var(--text-muted);
        margin-bottom: 1.2rem;
      }

      .auth-container input {
        width: 100%;
        padding: 12px;
        border-radius: var(--radius);
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        color: var(--text);
        margin-bottom: 1rem;
        font-size: 1rem;
      }

      .auth-container .btn.btn-primary {
        width: 100%;
        padding: 1rem;
        font-size: 1.1rem;
        margin-top: 0.5rem;
      }
    </style>
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <div class="auth-container">
      <h2>Change Password</h2>
      <p>Update your account password securely.</p>

      <form id="changePassForm">
        <input
          type="password"
          id="oldPassword"
          placeholder="Old Password"
          required
        />
        <input
          type="password"
          id="newPassword"
          placeholder="New Password"
          required
        />
        <button type="submit" class="btn btn-primary">Change Password</button>
      </form>

      <p style="margin-top: 1rem">
        <a href="javascript:history.back()">⬅ Back</a>
      </p>
    </div>

    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>

    <script
      type="module"
      src="/assets/js/pages/auth/change-password.js"
    ></script>
  </body>
</html>
