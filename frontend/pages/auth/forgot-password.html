<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password - FixMate</title>
  <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
  <link rel="stylesheet" href="/assets/css/global.css" />
</head>

<body>
  <div class="auth-container">
    <h2>Forgot Password</h2>
    <p>Enter your email to receive a reset link.</p>

    <form id="forgotForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Email" required />
        <div class="form-error"></div>
      </div>
      <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>

    <p class="mt-md">
      <a href="/pages/auth/login.html">Back to Login</a>
    </p>
  </div>

  <script type="module" src="/assets/js/pages/auth/forgot-password.js"></script>
<div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
