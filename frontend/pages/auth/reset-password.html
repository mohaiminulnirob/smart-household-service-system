<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset Password - FixMate</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div class="auth-container">
      <h2>Reset Password</h2>
      <p>Enter a new password for your account.</p>

      <form id="resetForm">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input
            type="password"
            id="newPassword"
            name="password"
            class="form-control"
            placeholder="New Password"
            required
          />
          <div class="form-error"></div>
        </div>
        <button type="submit" class="btn btn-primary">Reset Password</button>
      </form>

      <p class="mt-md">
        <a href="/pages/auth/login.html">Back to Login</a>
      </p>
    </div>

    <script
      type="module"
      src="/assets/js/pages/auth/reset-password.js"
    ></script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
