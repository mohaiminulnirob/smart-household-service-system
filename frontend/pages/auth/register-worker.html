<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register - FixMate (Worker)</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">
        <span class="logo-icon">🔧</span>
        <span>FixMate</span>
      </a>
      <button class="nav-toggle" id="navToggle">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/pages/aboutUs.html">About Us</a></li>
        <!-- Sign up as user -->
          <a href="/pages/auth/register-user.html" class="btn btn-secondary" style="padding: 0.5rem 1.5rem;">
            Sign Up as User
          </a>

        <!-- Normal Login -->
        <li>
          <a href="/pages/auth/login.html" class="btn btn-secondary" style="padding: 0.5rem 1.5rem;">
            Sign In
          </a>
        </li>

        <!-- Login as Admin -->
        <li>
          <a href="/pages/auth/login.html?as=admin" class="btn btn-primary1" style="padding: 0.5rem 1.5rem;">
            Login as Admin
          </a>
        </li>
      </ul>
    </div>
  </nav>


    <main class="container" style="padding: 3rem 1rem; max-width: 900px">
      <div class="card" style="margin: 0 auto; padding: 1.5rem">
        <div
          style="display: flex; gap: 12px; align-items: center; margin-bottom: 8px"
        >
          <div style="font-size: 26px">🧰</div>
          <div>
            <h2 style="margin: 0">Join as a worker</h2>
            <div style="color: var(--muted); font-size: 13px">
              Create your worker account. You'll need email verification & admin
              approval.
            </div>
          </div>
        </div>

        <form id="registerWorkerForm" novalidate>
          <div class="form-group">
            <label class="form-label">Full name</label>
            <input name="name" class="form-control" required />
            <div class="form-error" style="display: none"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" required />
            <div class="form-error" style="display: none"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input name="phone" type="tel" class="form-control" required placeholder="01xxxxxxxxx" />
            <div class="form-error" style="display: none"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" required />
            <div class="form-error" style="display: none"></div>
          </div>

          <!-- UPDATED: Dropdown skill category -->
          <div class="form-group">
            <label class="form-label">Skill Category</label>
            <select
              name="skill_category"
              id="skillCategorySelect"
              class="form-control"
              required
            >
              <option value="">Select your skill</option>
            </select>
            <div class="form-error" style="display: none"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Location (text)</label>
            <input name="location" class="form-control" placeholder="City / Area" />
          </div>

          <div
            style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px"
          >
            <div style="flex: 1">
              <label class="form-label">Latitude</label>
              <input
                name="latitude"
                class="form-control"
                placeholder="e.g. 23.7806"
              />
            </div>
            <div style="flex: 1">
              <label class="form-label">Longitude</label>
              <input
                name="longitude"
                class="form-control"
                placeholder="e.g. 90.2794"
              />
            </div>
            <div>
              <button
                id="geoBtn"
                type="button"
                class="btn btn-secondary"
                style="height: 40px; margin-top: 22px"
              >
                Use GPS
              </button>
            </div>
          </div>

          <div
            style="display: flex; justify-content: space-between; align-items: center; gap: 8px"
          >
            <a href="/pages/auth/login.html" class="btn btn-secondary">
              Back to login
            </a>
            <button class="btn btn-primary" type="submit">
              Create worker account
            </button>
          </div>
        </form>

        <div id="registerWorkerMessage" style="margin-top: 12px"></div>

        <!-- Incoming: Resend button -->
        <button
          id="resendVerifyBtn"
          class="btn btn-secondary"
          style="margin-top: 10px; display: none"
        >
          Resend verification email
        </button>
      </div>
    </main>

    <script type="module" src="/assets/js/pages/auth/register-worker.js"></script>
  </body>
</html>
