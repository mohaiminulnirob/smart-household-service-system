<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register - FixMate (Worker)</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <div id="navbar-dynamic"></div>

    <main class="container p-lg" style="max-width: 900px">
      <div class="card" style="margin: 0 auto; padding: 1.5rem">
        <div class="flex-row mb-sm">
          <div style="font-size: 26px">🧰</div>
          <div>
            <h2 style="margin: 0">Join as a worker</h2>
            <div class="text-muted" style="font-size: 13px">
              Create your worker account. You'll need email verification & admin
              approval.
            </div>
          </div>
        </div>

        <form id="registerWorkerForm" novalidate>
          <div class="form-group">
            <label class="form-label">Full name</label>
            <input name="name" class="form-control" required />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" required />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control" required />
            <div class="form-error"></div>
          </div>

          <!-- UPDATED: Dropdown skill category -->
          <div class="form-group">
            <label class="form-label">Skill Category</label>
            <select
              name="skill_category"
              id="skillCategorySelect"
              class="form-control"
              required
            >
              <option value="">Select your skill</option>
            </select>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Location (text)</label>
            <input name="location" class="form-control" placeholder="City / Area" />
          </div>

          <div class="flex-row gap-10 mb-md" style="align-items: flex-start">
            <div class="flex-1">
              <label class="form-label">Latitude</label>
              <input
                name="latitude"
                class="form-control"
                placeholder="e.g. 23.7806"
              />
            </div>
            <div class="flex-1">
              <label class="form-label">Longitude</label>
              <input
                name="longitude"
                class="form-control"
                placeholder="e.g. 90.2794"
              />
            </div>
            <div>
              <button
                id="geoBtn"
                type="button"
                class="btn btn-secondary"
                style="margin-top: 22px"
              >
                Use GPS
              </button>
            </div>
          </div>

          <div class="flex-row justify-between gap-sm">
            <a href="/pages/auth/login.html" class="btn btn-secondary">
              Back to login
            </a>
            <button class="btn btn-primary" type="submit">
              Create worker account
            </button>
          </div>
        </form>

        <div id="registerWorkerMessage" class="mt-md"></div>

        <!-- Incoming: Resend button -->
        <button
          id="resendVerifyBtn"
          class="btn btn-secondary mt-sm"
          style="display: none"
        >
          Resend verification email
        </button>
      </div>
    </main>

    <script type="module" src="/assets/js/pages/auth/register-worker.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
