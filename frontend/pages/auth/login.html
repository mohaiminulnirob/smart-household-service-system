<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - FixMate</title>
  <link rel="stylesheet" href="/assets/css/global.css" />
</head>

<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">
        <span class="logo-icon">🔧</span>
        <span>FixMate</span>
      </a>

      <button class="nav-toggle" id="navToggle">☰</button>

      <ul class="nav-links" id="navLinks">
        <li><a href="/pages/aboutUs.html">About Us</a></li>

        <!-- Normal Login -->
        <li>
          <a href="/pages/auth/register-user.html" class="btn btn-secondary" style="padding: 0.5rem 1.5rem;">
            Sign Up
          </a>
        </li>

        <!-- Login as Admin -->
        <li>
          <a href="/pages/auth/login.html?as=admin" class="btn btn-primary1" style="padding: 0.5rem 1.5rem;">
            Login as Admin
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container" style="padding: 3.5rem 1rem; max-width: 720px">
    <div class="card" style="margin: 0 auto; padding: 2rem">
      <div style="
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
          ">
        <div style="font-size: 28px">🔧</div>
        <div>
          <h2 style="margin: 0">Welcome back</h2>
          <div style="color: var(--muted); font-size: 13px">
            Sign in to your FixMate account
          </div>
        </div>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input id="email" name="email" type="email" class="form-control" placeholder="you@example.com" required />
          <div class="form-error" style="display: none"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" type="password" class="form-control" placeholder="••••••••" required />
          <div class="form-error" style="display: none"></div>
        </div>

        <!-- ROLE DROPDOWN -->
        <div class="form-group">
          <label class="form-label" for="role">Login As</label>
          <select id="role" name="role" class="form-control" required></select>
          <div class="form-error" style="display: none"></div>
        </div>

        <div style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 12px;
            ">
          <a href="/pages/auth/forgot-password.html" style="font-size: 13px; color: var(--muted)">
            Forgot password?
          </a>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </div>
      </form>

      <div style="
            text-align: center;
            color: var(--muted);
            margin-top: 12px;
            font-size: 14px;
          ">
        Don't have an account?
        <a href="/pages/auth/register-user.html" style="font-weight: 700">Sign up</a>
      </div>

      <div id="loginMessage" style="margin-top: 12px"></div>
    </div>
  </main>

  <script type="module" src="/assets/js/pages/auth/login.js"></script>
</body>

</html>
