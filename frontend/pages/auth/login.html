<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - FixMate</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a href="/" class="logo">
          <img src="/assets/images/fixmate-logo.png" alt="FixMate" class="logo-icon">
          <span>FixMate</span>
        </a>

        <button class="nav-toggle" id="navToggle">☰</button>

        <ul class="nav-links" id="navLinks">
          <li><a href="/pages/aboutUs.html">About Us</a></li>

          <!-- Normal Login -->
          <li>
            <a href="/pages/auth/login.html" class="btn btn-secondary">
              Sign In
            </a>
          </li>

          <!-- Login as Admin -->
          <li>
            <a href="/pages/auth/login.html?as=admin" class="btn btn-primary">
              Login as Admin
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container" style="max-width: 720px; padding-top: calc(var(--navbar-height, 70px) + 2rem); padding-left: 1.5rem; padding-right: 1.5rem; padding-bottom: 2rem">
      <div class="card" style="margin: 0 auto; padding: 2rem">
        <div class="flex-row mb-md">
          <div style="font-size: 28px">🔧</div>
          <div>
            <h2 style="margin: 0">Welcome back</h2>
            <div class="text-muted" style="font-size: 13px">
              Sign in to your FixMate account
            </div>
          </div>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              class="form-control"
              placeholder="you@example.com"
              required
            />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              placeholder="••••••••"
              required
            />
            <div class="form-error"></div>
          </div>

          <!-- ROLE DROPDOWN -->
          <div class="form-group">
            <label class="form-label" for="role">Login As</label>
            <select
              id="role"
              name="role"
              class="form-control"
              required
            ></select>
            <div class="form-error"></div>
          </div>

          <div class="flex-row justify-between mb-md">
            <a
              href="/pages/auth/forgot-password.html"
              class="text-muted"
              style="font-size: 13px"
            >
              Forgot password?
            </a>
            <button class="btn btn-primary" type="submit">Sign in</button>
          </div>
        </form>

        <div class="text-center text-muted mt-md" style="font-size: 14px">
          Don't have an account?
          <a href="/pages/auth/register-user.html" style="font-weight: 700"
            >Sign up</a
          >
        </div>

        <div id="loginMessage" class="mt-md"></div>
      </div>
    </main>

    <script type="module" src="/assets/js/pages/auth/login.js"></script>  
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
