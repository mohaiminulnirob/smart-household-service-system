<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register - FixMate (User)</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="container">
        <a href="/" class="logo">
          <span class="logo-icon">🔧</span>
          <span>FixMate</span>
        </a>
        <button class="nav-toggle" id="navToggle">☰</button>
        <ul class="nav-links" id="navLinks">
          <li>
            <a
              href="/pages/aboutUs.html"
              class="btn btn-secondary"
              style="padding: 0.5rem 1.5rem"
              >About Us</a
            >
          </li>
          <!-- Sign up as Worker -->
          <a
            href="/pages/auth/register-worker.html"
            class="btn btn-secondary"
            style="padding: 0.5rem 1.5rem"
          >
            Sign Up as Worker
          </a>

          <!-- Normal Login -->
          <li>
            <a
              href="/pages/auth/login.html"
              class="btn btn-secondary"
              style="padding: 0.5rem 1.5rem"
            >
              Sign In
            </a>
          </li>

          <!-- Login as Admin -->
          <li>
            <a
              href="/pages/auth/login.html?as=admin"
              class="btn btn-secondary"
              style="padding: 0.5rem 1.5rem"
            >
              Login as Admin
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container" style="padding: 3rem 1rem; max-width: 800px">
      <div class="card" style="margin: 0 auto; padding: 1.75rem">
        <div
          style="
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 8px;
          "
        >
          <div>
            <h2 style="margin: 0">Create your account</h2>
            <div style="color: var(--muted); font-size: 13px">
              Register as a user to request services
            </div>
          </div>
        </div>

        <form id="registerUserForm" novalidate>
          <div class="form-group">
            <label class="form-label">Full name</label>
            <input name="name" class="form-control" required />
            <div class="form-error" style="display: none"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input
              name="email"
              type="email"
              class="form-control"
              required
              placeholder="you@example.com"
            />
            <div class="form-error" style="display: none"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input
              name="phone"
              type="tel"
              class="form-control"
              required
              placeholder="01xxxxxxxxx"
            />
            <div class="form-error" style="display: none"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              name="password"
              type="password"
              class="form-control"
              required
            />
            <div class="form-error" style="display: none"></div>
          </div>

          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 8px;
            "
          >
            <a href="/pages/auth/login.html" class="btn btn-secondary"
              >Back to login</a
            >
            <button class="btn btn-primary" type="submit">
              Create account
            </button>
          </div>
        </form>

        <div id="registerUserMessage" style="margin-top: 12px"></div>
      </div>
    </main>

    <script type="module" src="/assets/js/pages/auth/register-user.js"></script>
  </body>
</html>
