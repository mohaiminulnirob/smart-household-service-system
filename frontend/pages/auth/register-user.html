<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register - FixMate (User)</title>
    <link rel="icon" type="image/png" href="/assets/images/fixmate-logo.png" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <div id="navbar-dynamic"></div>

    <main class="container p-lg" style="max-width: 800px">
      <div class="card" style="margin: 0 auto; padding: 1.75rem">
        <div class="flex-row mb-sm">
          <div style="font-size: 26px">🔐</div>
          <div>
            <h2 style="margin: 0">Create your account</h2>
            <div class="text-muted" style="font-size: 13px">
              Register as a user to request services
            </div>
          </div>
        </div>

        <form id="registerUserForm" novalidate>
          <div class="form-group">
            <label class="form-label">Full name</label>
            <input name="name" class="form-control" required />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" required />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              name="password"
              type="password"
              class="form-control"
              required
            />
            <div class="form-error"></div>
          </div>

          <div class="flex-row justify-between gap-sm">
            <a href="/pages/auth/login.html" class="btn btn-secondary"
              >Back to login</a
            >
            <button class="btn btn-primary" type="submit">
              Create account
            </button>
          </div>
        </form>

        <div id="registerUserMessage" class="mt-md"></div>
      </div>
    </main>

    <script type="module" src="/assets/js/pages/auth/register-user.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  <div id="footer-dynamic"></div>
<script type="module">
  import { renderFooterInto } from "/assets/js/components/footer.js";
  renderFooterInto();
</script>
</body>
</html>
